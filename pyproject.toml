[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coolmem"
version = "0.10.0"
description = "Add/Search memory service (FastAPI + SQLite)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30,<1",
  "cutword>=0.1,<1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6,<1",
]

[project.scripts]
coolmem = "app.main:main"

[tool.setuptools]
packages = ["app", "app.api", "app.api.routers", "app.services", "app.storage"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
